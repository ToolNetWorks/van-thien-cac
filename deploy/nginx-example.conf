# Example only. Replace the domain and site root, then enable TLS separately.
# Do not make this public until real movie metadata and authorized sources are configured.
server {
    listen 80;
    server_name phim.example.com;
    root /var/www/van-thien-cac;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:svg|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /data/movies.json {
        add_header Cache-Control "no-store";
    }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
